name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist
      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    name: PHP ${{ matrix.php }}${{ matrix.lowest && ' (lowest deps)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        lowest: [false]
        include:
          - php: '8.1'
            lowest: true
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist ${{ matrix.lowest && '--prefer-lowest' || '' }}
      - name: PHPUnit
        run: vendor/bin/phpunit ${{ matrix.php == '8.3' && '--coverage-text' || '' }}

  build:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install as a dependency of a fresh project
        run: |
          mkdir /tmp/app && cd /tmp/app
          composer init --no-interaction --name=acme/app --stability=stable
          composer config repositories.local '{"type": "path", "url": "'"$GITHUB_WORKSPACE"'", "options": {"symlink": false}}'
          composer config allow-plugins.php-http/discovery true
          composer require --no-interaction pidgely/pidgely-php:@dev guzzlehttp/guzzle
          php -r 'require "vendor/autoload.php"; $c = Pidgely::client("pdg_x"); echo Pidgely\Client::VERSION, PHP_EOL; if (str_contains(print_r($c, true), "pdg_x")) { exit(1); }'
